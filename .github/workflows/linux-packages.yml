name: Linux packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The release step attaches build artifacts with GITHUB_TOKEN, which needs
# write access to release contents. Set explicitly rather than relying on the
# repository default, which may be read-only.
permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install the build and packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
          desktop-file-utils file

    - name: Build ionlauncher
      run: cargo build --release

    - name: Check the binary links only against libraries we declare
      run: ldd target/release/ionlauncher

    - name: Build the Debian package
      run: ./installer/linux/build-deb.sh

    - name: Build the AppImage
      run: ./installer/linux/build-appimage.sh

    - name: Validate the desktop entry
      run: desktop-file-validate installer/linux/ionlauncher.desktop

    - name: Install the package and check what landed
      run: |
        # apt, not dpkg: the runner does not carry every X11 library the app
        # links against, and apt resolves the Depends list from the archive.
        sudo apt-get install -y ./dist/ionlauncher_*.deb
        test -x /usr/bin/ionlauncher
        test -f /usr/share/applications/ionlauncher.desktop
        test -f /usr/share/icons/hicolor/256x256/apps/ionlauncher.png
        ionlauncher --version

    - name: Smoke-test the AppImage
      run: |
        chmod +x dist/ionlauncher-*.AppImage
        ./dist/ionlauncher-*.AppImage --appimage-extract >/dev/null
        test -x squashfs-root/usr/bin/ionlauncher
        ./squashfs-root/AppRun --version

    - name: Upload the packages
      uses: actions/upload-artifact@v4
      with:
        name: IonLauncher-Linux
        path: |
          dist/ionlauncher_*.deb
          dist/ionlauncher-*.AppImage
        if-no-files-found: error

    - name: Attach the packages to the release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ionlauncher_*.deb
          dist/ionlauncher-*.AppImage
